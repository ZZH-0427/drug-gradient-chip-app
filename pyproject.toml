[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drug-gradient-chip-app"
version = "0.1.0"
description = "Forward model runtime wrapper for drug concentration gradient chip prediction."
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "numpy",
  "pandas",
  "pydantic",
  "pywebview==6.2.1",
  "torch",
  "torch-geometric",
  "uvicorn",
  "xxhash",
]

[project.optional-dependencies]
test = [
  "httpx",
  "pytest",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.setuptools.packages.find]
where = ["backend"]
