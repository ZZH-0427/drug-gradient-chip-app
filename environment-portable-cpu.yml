name: drug-chip-portable-cpu
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --index-url https://download.pytorch.org/whl/cpu
      - torch==2.9.0+cpu
      - --extra-index-url https://pypi.org/simple
      - --find-links https://data.pyg.org/whl/torch-2.9.0+cpu.html
      - pyg-lib==0.7.0+pt29cpu
      - torch-scatter==2.1.2+pt29cpu
      - torch-sparse==0.6.18+pt29cpu
      - torch-cluster==1.6.3+pt29cpu
      - torch-spline-conv==1.2.2+pt29cpu
      - torch-geometric==2.8.0
      - fastapi==0.139.0
      - uvicorn==0.51.0
      - pydantic==2.13.4
      - numpy==2.4.6
      - scipy==1.17.1
      - pandas==3.0.3
      - xxhash==3.8.1
      - bottle==0.13.4
      - cffi==2.1.1
      - clr-loader==0.3.1
      - pycparser==3.0
      - pythonnet==3.1.0
      - proxy-tools==0.1.0
      - pywebview==6.2.1
